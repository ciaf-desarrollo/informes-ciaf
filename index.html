<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informes CIAF</title>
<meta name="description" content="Informes de tu empresa, por CIAF Consultora Integral">
<meta name="theme-color" content="#003e6e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Informes CIAF">
<style>
  :root {
    --ciaf: #003e6e;
    --fondo: #f3f5f8;
    --tarjeta: #ffffff;
    --texto: #16222e;
    --suave: #637282;
    --borde: #d9e0e7;
    --marca: #003e6e;
    --marca-texto: #ffffff;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0d1621;
      --tarjeta: #16212d;
      --texto: #e8eef4;
      --suave: #93a3b3;
      --borde: #2a3744;
      --marca: #4f9ad8;
      --marca-texto: #06121e;
      --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    width: 100%;
    background: var(--ciaf);
    display: flex; justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 16px 28px;
  }
  header img { height: 72px; width: auto; display: block; }
  main { width: 100%; max-width: 380px; padding: 28px 16px 24px; flex: 1; }
  h1 { font-size: 1.35rem; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; color: var(--suave); margin: 0 0 24px; }
  .tarjeta {
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 16px; padding: 20px;
  }
  label.campo { display: block; font-size: .875rem; color: var(--suave); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; font-size: 1.2rem; letter-spacing: 2px; text-align: center;
    padding: 14px; border-radius: 12px; border: 1px solid var(--borde);
    background: var(--fondo); color: var(--texto);
  }
  input:focus { outline: 2px solid var(--marca); outline-offset: 1px; }
  .recordar { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; font-size: .9rem; color: var(--suave); }
  .recordar input { width: 18px; height: 18px; accent-color: var(--marca); }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 14px;
    border-radius: 12px; border: 0; cursor: pointer;
    background: var(--marca); color: var(--marca-texto);
  }
  button:disabled { opacity: .6; cursor: default; }
  button.secundario { background: transparent; color: var(--suave); font-weight: 500; margin-top: 10px; }
  .error { color: var(--error); font-size: .9rem; min-height: 1.3em; margin: 10px 0 0; text-align: center; }
  .empresa-logo { display: flex; justify-content: center; margin: 4px 0 18px; }
  .empresa-logo img { max-height: 72px; max-width: 100%; }
  /* Recuadro para instalar la app (se oculta si ya está instalada) */
  .instalar {
    margin-top: 16px; display: flex; align-items: center; gap: 12px;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 12px 14px;
  }
  .instalar img { flex: none; width: 44px; height: 44px; border-radius: 10px; }
  .instalar .txt { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: .875rem; color: var(--suave); }
  .instalar .txt strong { color: var(--texto); font-size: .95rem; }
  .instalar button { flex: none; width: auto; padding: 10px 16px; }
  /* Huella */
  .con-icono { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .oferta {
    margin-top: 12px; padding: 12px; border-radius: 12px;
    background: var(--fondo); border: 1px dashed var(--borde);
    display: grid; gap: 10px; font-size: .9rem; color: var(--suave);
  }
  .oferta p { margin: 0; }
  .oferta strong { color: var(--texto); }
  button.borde { background: transparent; color: var(--marca); border: 1px solid var(--marca); margin-top: 10px; }
  footer { color: var(--suave); font-size: .75rem; padding: 12px 16px max(16px, env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }

  /* Visor: los informes se muestran dentro de la app (nunca se abre
     script.google.com en el celular). Barra fija arriba + informe abajo. */
  #visor {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    background: #ffffff;
  }
  .barra {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--ciaf); color: #fff;
    padding: max(8px, env(safe-area-inset-top)) 12px 8px;
    min-height: 56px;
  }
  .barra button {
    width: auto; flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, .14); color: #fff; font-weight: 600; font-size: .95rem;
  }
  .barra button:active { background: rgba(255, 255, 255, .26); }
  .barra .titulo {
    flex: 1; min-width: 0;
    font-weight: 600; font-size: 1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .barra .logo-emp {
    flex: none; height: 32px; max-width: 96px; object-fit: contain;
    background: #fff; border-radius: 8px; padding: 3px 6px;
  }
  #visorFrame { flex: 1; width: 100%; border: 0; display: block; background: #fff; }

  /* Pantalla de carga: una tarjeta que gira como una moneda, con CIAF de un
     lado y la empresa del otro. Mientras se verifica la clave muestra CIAF en
     las dos caras; cuando ya se sabe la empresa, alterna CIAF ↔ empresa. */
  #carga {
    position: fixed; inset: 0; z-index: 10;
    background: radial-gradient(120% 90% at 50% 35%, #ffffff 0%, #eef3f8 70%, #e3ebf3 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    animation: aparecer .3s ease-out;
  }
  .escena { perspective: 900px; display: flex; flex-direction: column; align-items: center; }
  .moneda {
    position: relative;
    width: min(240px, 70vw); aspect-ratio: 12 / 8;
    transform-style: preserve-3d;
    animation: girarSolo 1.8s cubic-bezier(.45, .05, .55, .95) infinite;
  }
  .moneda.con-empresa { animation: voltear 3.2s cubic-bezier(.65, 0, .35, 1) infinite; }
  .cara {
    position: absolute; inset: 0;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 18px 40px -18px rgba(0, 40, 80, .45), 0 2px 6px rgba(0, 40, 80, .12);
    overflow: hidden;
  }
  .cara.frente { background: #003e6e; }
  .cara.frente img { width: 82%; height: auto; }
  .cara.dorso { background: #ffffff; transform: rotateY(180deg); border: 1px solid #e3e9ef; }
  .cara.dorso img { max-width: 80%; max-height: 72%; object-fit: contain; }
  .cara.dorso.es-ciaf { background: #003e6e; border: 0; }
  .cara.dorso.es-ciaf img { width: 82%; max-width: none; max-height: none; height: auto; }
  /* Brillo que cruza la tarjeta */
  .cara::after {
    content: ""; position: absolute; inset: -40% auto -40% -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent);
    transform: skewX(-18deg);
    animation: brillo 3.2s ease-in-out infinite;
  }
  .sombra {
    width: min(170px, 50vw); height: 14px; margin-top: 22px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 40, 80, .28), transparent);
    animation: sombra 1.8s cubic-bezier(.45, .05, .55, .95) infinite;
  }
  .moneda.con-empresa + .sombra { animation-duration: 3.2s; animation-name: sombraVoltear; }
  #carga .texto { color: #3d5266; font-size: 1rem; font-weight: 500; text-align: center; min-height: 1.5em; }
  .puntos { display: inline-flex; gap: 5px; margin-left: 6px; vertical-align: middle; }
  .puntos i { width: 6px; height: 6px; border-radius: 50%; background: #003e6e; opacity: .25; animation: punto 1.2s ease-in-out infinite; }
  .puntos i:nth-child(2) { animation-delay: .15s; }
  .puntos i:nth-child(3) { animation-delay: .3s; }
  #btnVolverCarga {
    width: auto; padding: 10px 18px; border-radius: 999px;
    background: transparent; color: #3d5266; border: 1px solid #c9d5e0; font-weight: 500;
  }

  @keyframes girarSolo {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  @keyframes voltear {
    0%, 30%   { transform: rotateY(0deg); }
    50%, 80%  { transform: rotateY(180deg); }
    100%      { transform: rotateY(360deg); }
  }
  @keyframes sombra {
    0%, 100% { transform: scaleX(1); opacity: 1; }
    25%, 75% { transform: scaleX(.35); opacity: .55; }
    50%      { transform: scaleX(1); opacity: 1; }
  }
  @keyframes sombraVoltear {
    0%, 30%, 50%, 80%, 100% { transform: scaleX(1); opacity: 1; }
    40%, 90% { transform: scaleX(.35); opacity: .55; }
  }
  @keyframes brillo { 0%, 55% { left: -60%; } 85%, 100% { left: 130%; } }
  @keyframes punto { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

  /* Sin animaciones si el celular lo pide: los logos se alternan suave */
  @media (prefers-reduced-motion: reduce) {
    #carga, .cara::after, .sombra, .puntos i { animation: none; }
    .moneda, .moneda.con-empresa { animation: none; }
    .moneda.con-empresa .frente { animation: fundido 3.2s ease-in-out infinite; }
    .moneda.con-empresa .dorso { transform: none; animation: fundido 3.2s ease-in-out infinite reverse; }
    @keyframes fundido { 0%, 40% { opacity: 1; } 50%, 90% { opacity: 0; } 100% { opacity: 1; } }
  }
</style>
</head>
<body>
<header>
  <img src="./logo-ciaf.webp" alt="CIAF Consultora Integral" width="115" height="72">
</header>

<main>
  <h1>Informes</h1>
  <p class="sub" id="subtitulo">Ingresá la clave de tu empresa</p>

  <!-- Ingreso con clave -->
  <form id="formIngreso" class="tarjeta" autocomplete="off" hidden>
    <label class="campo" for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <label class="recordar"><input id="recordar" type="checkbox" checked> Recordar en este celular</label>
    <button id="btnEntrar" type="submit">Entrar</button>
    <p id="error" class="error" role="alert"></p>
  </form>

  <!-- Clave recordada: entrar con un toque -->
  <section id="recordada" class="tarjeta" hidden>
    <div class="empresa-logo"><img id="logoRecordada" alt=""></div>
    <button id="btnHuella" type="button" class="con-icono" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v3a8 8 0 0 1-1.5 4.7"/><path d="M8.5 9.5A4 4 0 0 1 16 11v2a12 12 0 0 1-.7 4"/><path d="M5 12a7 7 0 0 1 12.7-4"/><path d="M19 11.5V13a16 16 0 0 1-.4 3.5"/><path d="M8 13a10 10 0 0 1-1.2 4.8"/></svg>
      Entrar con huella
    </button>
    <button id="btnAbrir" type="button">Ver informes</button>
    <div id="ofertaHuella" class="oferta" hidden>
      <p><strong>Entrá más rápido.</strong> Usá la huella o la cara del celular en lugar de escribir la clave.</p>
      <button id="btnActivarHuella" type="button" class="borde">Activar huella</button>
    </div>
    <button id="btnSalir" type="button" class="secundario">Salir / cambiar de empresa</button>
    <p id="error2" class="error" role="alert"></p>
  </section>

  <!-- Instalar en el celular -->
  <div class="instalar" id="instalar" hidden>
    <img src="./icon-192.png" alt="">
    <div class="txt">
      <strong>Instalá la app</strong>
      <span id="instalarAyuda">Queda en tu pantalla de inicio con el ícono de CIAF.</span>
    </div>
    <button id="btnInstalar" type="button" hidden>Instalar</button>
  </div>
</main>

<footer>CIAF Consultora Integral</footer>

<!-- Visor de informes -->
<section id="visor" hidden>
  <div class="barra">
    <button id="visorVolver" type="button" aria-label="Volver">← Volver</button>
    <div class="titulo" id="visorTitulo">Informes</div>
    <img class="logo-emp" id="visorLogo" alt="">
  </div>
  <iframe id="visorFrame" title="Informe"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-top-navigation-to-custom-protocols"></iframe>
</section>

<div id="carga" hidden>
  <div class="escena" aria-hidden="true">
    <div class="moneda" id="moneda">
      <div class="cara frente"><img src="./logo-ciaf.webp" alt=""></div>
      <div class="cara dorso es-ciaf" id="cargaDorso"><img id="cargaLogo" src="./logo-ciaf.webp" alt=""></div>
    </div>
    <div class="sombra"></div>
  </div>
  <div class="texto" role="status" aria-live="polite"><span id="cargaTexto">Verificando clave</span><span class="puntos" aria-hidden="true"><i></i><i></i><i></i></span></div>
  <button id="btnVolverCarga" type="button">← Volver</button>
</div>

<script>
  var LS_KEY = 'informes_sesion_v1';

  function leerSesion() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; }
  }
  function guardarSesion(s) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function borrarSesion() {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }
  function logoDe(id) { return './logo-' + encodeURIComponent(id) + '.webp'; }

  // Empresas: cada "url" es una implementación del Apps Script de esa empresa hecha
  // solo para la app (acceso "Cualquier usuario"); la de siempre no se toca.
  // La clave de cada una es el PIN_CORRECTO de su script; acá no se guarda ninguna.
  // Para sumar una empresa: agregar una línea y su logo en logo-<id>.webp.
  // "clavesPin": dónde guardan el PIN los informes de esa empresa; la app les
  // deja ahí el pase para que no lo pidan.
  var EMPRESAS = [
    { id: 'santaclara', nombre: 'Santa Clara', clavesPin: ['sc_pin_santaclara'], url: 'https://script.google.com/macros/s/AKfycbxLX6UiowvzZR_oKT91_QH4vLDdWCeJPkf9m_53NhYixbCWy6xsIr-tfYA2_XFzjtCh/exec' },
    // "externos": informes que en la web de siempre abren otro sitio; en la app
    // se abren adentro, con la vista del script que los reemplaza.
    { id: 'puntoi', nombre: 'Punto i', clavesPin: ['pi_pin_puntoi', 'ansilta_pin'], externos: { 'flujodefondospuntoi.netlify.app': 'dashboard' }, url: 'https://script.google.com/macros/s/AKfycbxbdbdT-PGq4lfvA_fUxQfusg0uhTkqn4GaPWTHXB2riBhfGTM3ETn6_F3GeDh_ETR9/exec' },
    { id: 'ansilta', nombre: 'Ansilta', clavesPin: ['ansilta_pin'], url: 'https://script.google.com/macros/s/AKfycbyKN3u_-wDKAstu1vUcIi1f0GXvYEVUTOF9hFvrPPXJfKeVW3EitVhYWoxbb3kYOamP3A/exec' }
  ];

  // Todo lo que la app le pide a un script va por acá (POST "por detrás"). Así
  // el celular nunca abre script.google.com y no importa cuántas cuentas de
  // Google tenga iniciadas.
  async function pedirAlScript(emp, cuerpo) {
    var r = await fetch(emp.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo)
    });
    return JSON.parse(await r.text());
  }

  // Le pregunta la clave a cada script (en paralelo). El que la acepta devuelve
  // un pase temporal (6 h). La clave nunca viaja en un link: solo el pase.
  async function pedirAcceso(emp, clave) {
    try {
      var d = await pedirAlScript(emp, { accion: 'acceso', clave: clave });
      return d && d.ok && typeof d.acceso === 'string' ? { acceso: d.acceso } : {};
    } catch (e) {
      return { error: true };
    }
  }

  async function ingresar(clave) {
    var resp = await Promise.all(EMPRESAS.map(function (emp) { return pedirAcceso(emp, clave); }));
    for (var i = 0; i < resp.length; i++) {
      if (resp[i].acceso) {
        var emp = EMPRESAS[i];
        return {
          empresa: emp, acceso: resp[i].acceso, clave: clave,
          url: emp.url + '?acceso=' + encodeURIComponent(resp[i].acceso)
        };
      }
    }
    var algunoFallo = resp.some(function (r) { return r.error; });
    throw new Error(algunoFallo
      ? 'Clave incorrecta, o algún informe no respondió. Probá de nuevo en un momento.'
      : 'Clave incorrecta.');
  }

  // ---- Pantalla de carga ----
  // Se muestra apenas se toca Entrar. Sin empresa: la tarjeta gira con CIAF en
  // las dos caras. Con empresa: alterna CIAF ↔ empresa hasta que abre la web.
  var cargaCancelada = false;
  var temporizadorAbrir = null;

  function mostrarCarga(empresa, texto) {
    var moneda = document.getElementById('moneda');
    var dorso = document.getElementById('cargaDorso');
    var logo = document.getElementById('cargaLogo');
    if (empresa) {
      logo.src = logoDe(empresa.id);
      dorso.classList.remove('es-ciaf');
      moneda.classList.add('con-empresa');
    } else {
      logo.src = './logo-ciaf.webp';
      dorso.classList.add('es-ciaf');
      moneda.classList.remove('con-empresa');
    }
    document.getElementById('cargaTexto').textContent = texto;
    document.getElementById('carga').hidden = false;
  }
  function ocultarCarga() {
    clearTimeout(temporizadorAbrir);
    document.getElementById('carga').hidden = true;
  }

  // ---- Visor de informes ----
  // ACTIVA: la empresa abierta, su pase y la clave (en memoria, para renovar
  // el pase solo cuando vence). PILA: pantallas abiertas, para Volver.
  var ACTIVA = null;
  var PILA = [];
  var PASE_DURA_MS = 5.5 * 60 * 60 * 1000; // el script lo da por 6 h
  var pedidoVista = 0;

  // Abre los informes de la empresa dentro de la app.
  function abrir(datos) {
    if (cargaCancelada) return;
    ACTIVA = { emp: datos.empresa, acceso: datos.acceso, clave: datos.clave, desde: Date.now() };
    PILA = [];
    document.getElementById('visorLogo').src = logoDe(datos.empresa.id);
    document.getElementById('visorLogo').alt = datos.empresa.nombre;
    cargarVista('inicio', '', true);
  }

  async function renovarPase() {
    var r = await pedirAcceso(ACTIVA.emp, ACTIVA.clave);
    if (!r.acceso) throw new Error(r.error ? 'No se pudo conectar. Revisá la conexión.' : 'La clave ya no es válida.');
    ACTIVA.acceso = r.acceso;
    ACTIVA.desde = Date.now();
  }

  // Pide algo al script con el pase; si venció, lo renueva una vez y reintenta.
  async function pedirConPase(cuerpo) {
    if (Date.now() - ACTIVA.desde > PASE_DURA_MS) await renovarPase();
    cuerpo.acceso = ACTIVA.acceso;
    var d = await pedirAlScript(ACTIVA.emp, cuerpo);
    if (!d.ok && d.error === 'PASE_VENCIDO') {
      await renovarPase();
      cuerpo.acceso = ACTIVA.acceso;
      d = await pedirAlScript(ACTIVA.emp, cuerpo);
    }
    return d;
  }

  // Preferencias que los informes guardan en el navegador: quedan en la app,
  // separadas por empresa. El PIN no se guarda: lo reemplaza el pase.
  function prefijoDatos() { return 'emp_' + ACTIVA.emp.id + '_'; }
  function datosGuardados() {
    var out = {};
    try {
      var p = prefijoDatos();
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(p) === 0) out[k.slice(p.length)] = localStorage.getItem(k);
      }
    } catch (e) {}
    ACTIVA.emp.clavesPin.forEach(function (k) { out[k] = ACTIVA.acceso; });
    return out;
  }

  // Va al principio de cada pantalla del informe. google.script.run solo existe
  // en script.google.com: acá cada llamada se le pasa a la app, que se la pide
  // al script (y el script solo acepta las de su lista). También le da un
  // localStorage propio y le pasa a la app los links a otros informes.
  function puenteInforme(guardado, externosEmpresa, pase) {
    var datos = guardado || {};
    // Cualquier dato con "pin" en el nombre es el PIN interno de un informe:
    // en la app siempre vale el pase, así ninguna pantalla lo pide.
    var esPin = function (k) { return /(^|[_-])pin([_-]|$)/i.test(String(k)); };
    // Los cuadros de PIN de los informes no se muestran nunca en la app: se
    // entra solo con la clave de ingreso.
    try {
      var estilo = document.createElement('style');
      estilo.textContent = '#pinOverlay,#deudaPinOverlay,#concPinOverlay,[id$="PinOverlay"]{display:none!important}';
      (document.head || document.documentElement).appendChild(estilo);
    } catch (e) {}
    var externos = externosEmpresa || {};
    var memoria = {
      getItem: function (k) {
        if (esPin(k) && pase) return pase;
        if (k === 'desde_app_ciaf') return null; // la app ya tiene su botón Volver
        return Object.prototype.hasOwnProperty.call(datos, k) ? datos[k] : null;
      },
      setItem: function (k, v) {
        if (esPin(k) || k === 'desde_app_ciaf') return; // el PIN no se guarda: lo reemplaza el pase
        datos[k] = String(v);
        parent.postMessage({ tipo: 'ciaf-guardar', clave: k, valor: String(v) }, '*');
      },
      removeItem: function (k) { delete datos[k]; parent.postMessage({ tipo: 'ciaf-guardar', clave: k, valor: null }, '*'); },
      clear: function () { Object.keys(datos).forEach(memoria.removeItem); },
      key: function (i) { return Object.keys(datos)[i] || null; }
    };
    Object.defineProperty(memoria, 'length', { get: function () { return Object.keys(datos).length; } });
    try { Object.defineProperty(window, 'localStorage', { value: memoria, configurable: true }); } catch (e) {}

    var pendientes = {};
    var siguiente = 0;
    function corredor(exito, fallo, objeto) {
      return new Proxy({}, {
        get: function (_, nombre) {
          if (nombre === 'withSuccessHandler') return function (f) { return corredor(f, fallo, objeto); };
          if (nombre === 'withFailureHandler') return function (f) { return corredor(exito, f, objeto); };
          if (nombre === 'withUserObject') return function (o) { return corredor(exito, fallo, o); };
          if (typeof nombre !== 'string' || nombre === 'then') return undefined;
          return function () {
            var id = ++siguiente;
            pendientes[id] = { exito: exito, fallo: fallo, objeto: objeto };
            parent.postMessage({ tipo: 'ciaf-run', id: id, fn: nombre, args: Array.prototype.slice.call(arguments) }, '*');
          };
        }
      });
    }
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (ev.source !== parent || !d || d.tipo !== 'ciaf-respuesta' || !pendientes[d.id]) return;
      var p = pendientes[d.id];
      delete pendientes[d.id];
      // Si el script respondiera "PIN incorrecto", la app renueva el pase y
      // vuelve a abrir la pantalla (en vez de que el informe pida el PIN).
      if (!d.ok && /PIN incorrecto/i.test(String(d.error))) { parent.postMessage({ tipo: 'ciaf-pin' }, '*'); return; }
      if (d.ok) { if (p.exito) p.exito(d.resultado, p.objeto); }
      else if (p.fallo) { p.fallo(new Error(d.error), p.objeto); }
      else { console.error(d.error); }
    });
    window.google = {
      script: {
        run: corredor(null, null, undefined),
        host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} }, origin: 'https://script.google.com' },
        url: { getLocation: function (cb) { cb({ hash: location.hash.slice(1), parameter: {}, parameters: {} }); } },
        history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} }
      }
    };
    // Avisa a la app apenas la pantalla está lista (sin esperar tipografías).
    document.addEventListener('DOMContentLoaded', function () { parent.postMessage({ tipo: 'ciaf-listo' }, '*'); });

    // ---- Ajuste para celular ----
    // Los informes se armaron para computadora. En pantallas angostas, lo que
    // se sale del ancho se acomoda: filas que bajan de renglón, tablas que se
    // deslizan de costado, grillas en una columna. Se vuelve a aplicar cada
    // vez que el informe dibuja datos nuevos.
    try {
      var estiloCel = document.createElement('style');
      estiloCel.textContent =
        'img,video,canvas{max-width:100%}' +
        '.ciaf-desliza{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}' +
        '.ciaf-desliza>table{margin:0}' +
        // Restos de unos pocos px (sombras, adornos) que harían mover la página de costado.
        '@media (max-width:760px){html{overflow-x:hidden}' +
        // Encabezados "logos + título" de los informes: el título baja a su propio renglón.
        '.brand{flex-wrap:wrap;row-gap:8px}' +
        '.brand>div:last-child:not([style*="width:1px"]){flex:1 1 100%;min-width:0}' +
        '.topbar,.actions{flex-wrap:wrap}}' +
        // Imagen todavía sin cargar (src vacío): no mostrar el ícono de imagen rota.
        'img[src=""],img:not([src]){visibility:hidden}';
      (document.head || document.documentElement).appendChild(estiloCel);
    } catch (e) {}
    function seDesliza(el) {
      for (var n = el.parentElement; n && n !== document.body; n = n.parentElement) {
        var ox = getComputedStyle(n).overflowX;
        if (ox === 'auto' || ox === 'scroll' || ox === 'hidden') return true;
      }
      return false;
    }
    function ajustarCelular() {
      var W = document.documentElement.clientWidth;
      if (!W || W > 760 || !document.body) return;
      for (var pasada = 0; pasada < 3; pasada++) {
        var cambio = false;
        // 1) Tablas más anchas que la pantalla: dentro de un recuadro que se desliza.
        var tablas = document.querySelectorAll('table');
        for (var t = 0; t < tablas.length; t++) {
          var tb = tablas[t];
          if (tb.parentElement && tb.parentElement.classList.contains('ciaf-desliza')) continue;
          if (tb.getBoundingClientRect().right <= W + 1 || seDesliza(tb)) continue;
          var caja = document.createElement('div');
          caja.className = 'ciaf-desliza';
          tb.parentNode.insertBefore(caja, tb);
          caja.appendChild(tb);
          cambio = true;
        }
        // 2) Otros elementos que se salen (el de más afuera de cada rama).
        var todos = document.body.querySelectorAll('*');
        for (var i = 0; i < todos.length; i++) {
          var el = todos[i];
          if (el.tagName === 'TABLE' || el.closest('.ciaf-desliza') || el.closest('svg')) continue;
          var r = el.getBoundingClientRect();
          if (!r.width || r.right <= W + 1) continue;
          var padre = el.parentElement;
          if (padre && padre !== document.body && padre.getBoundingClientRect().right > W + 1) continue;
          if (seDesliza(el)) continue;
          var cs = getComputedStyle(el);
          if (cs.position === 'fixed' || cs.position === 'absolute') continue;
          if (cs.display.indexOf('flex') >= 0 && cs.flexWrap === 'nowrap' && cs.flexDirection.indexOf('row') === 0) {
            el.style.flexWrap = 'wrap';
          } else if (cs.display.indexOf('grid') >= 0) {
            el.style.gridTemplateColumns = 'minmax(0,1fr)';
          } else {
            el.style.maxWidth = '100%';
            el.style.minWidth = '0';
            if (parseFloat(cs.width) > W) el.style.width = 'auto';
          }
          el.style.boxSizing = 'border-box';
          cambio = true;
        }
        // 3) Textos largos aplastados al lado de otros (ej. título junto a los
        //    logos): pasan a su propio renglón, con todo el ancho.
        var filas = document.body.querySelectorAll('*');
        for (var f = 0; f < filas.length; f++) {
          var fila = filas[f];
          if (fila.closest('.ciaf-desliza') || fila.closest('svg') || fila.closest('table')) continue;
          var fs = getComputedStyle(fila);
          if (fs.display.indexOf('flex') < 0 || fs.flexDirection.indexOf('row') !== 0) continue;
          var hijos = fila.children;
          if (hijos.length < 2) continue;
          for (var h = 0; h < hijos.length; h++) {
            var hijo = hijos[h];
            var texto = (hijo.textContent || '').replace(/\s+/g, ' ').trim();
            var hr = hijo.getBoundingClientRect();
            if (texto.length >= 18 && hr.width > 0 && hr.width < 130 && hr.height > 70) {
              fila.style.flexWrap = 'wrap';
              hijo.style.flexBasis = '100%';
              hijo.style.maxWidth = '100%';
              cambio = true;
            }
          }
        }
        if (!cambio) break;
      }
    }
    var esperaAjuste = null;
    function pedirAjuste() { clearTimeout(esperaAjuste); esperaAjuste = setTimeout(ajustarCelular, 250); }
    document.addEventListener('DOMContentLoaded', function () {
      pedirAjuste();
      try { new MutationObserver(pedirAjuste).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
    });
    window.addEventListener('load', pedirAjuste);
    window.addEventListener('resize', pedirAjuste);
    // Tipografías y logos que terminan de cargar después cambian el tamaño de
    // las cosas sin "cambiar" la página: se reajusta varias veces al principio.
    var vecesAjuste = 0;
    var relojAjuste = setInterval(function () { ajustarCelular(); if (++vecesAjuste >= 20) clearInterval(relojAjuste); }, 1000);
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(pedirAjuste); } catch (e) {}
    // Links a otro informe del mismo script (Inicio, Caja, Cheques…): los abre la app.
    document.addEventListener('click', function (ev) {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(href)) {
        ev.preventDefault();
        parent.postMessage({ tipo: 'ciaf-navegar', url: href }, '*');
        return;
      }
      // Informe que en la web de siempre abre otro sitio: la app lo abre adentro.
      var host = '';
      try { host = new URL(href, 'https://x.invalid/').hostname; } catch (e) {}
      if (host && Object.prototype.hasOwnProperty.call(externos, host)) {
        ev.preventDefault();
        parent.postMessage({ tipo: 'ciaf-navegar', url: 'https://script.google.com/macros/s/app/exec?vista=' + encodeURIComponent(externos[host]) }, '*');
      }
    }, true);
  }

  function prepararHtml(html) {
    var guardado = JSON.stringify(datosGuardados()).replace(/</g, '\\u003c');
    var externos = JSON.stringify(ACTIVA.emp.externos || {}).replace(/</g, '\\u003c');
    var puente = '<script>(' + puenteInforme.toString() + ')(' + guardado + ', ' + externos + ', ' + JSON.stringify(ACTIVA.acceso) + ');<\/script>';
    var i = html.search(/<head[^>]*>/i);
    if (i >= 0) {
      var fin = html.indexOf('>', i) + 1;
      return html.slice(0, fin) + puente + html.slice(fin);
    }
    return puente + html;
  }

  // Carga una pantalla del script (vista) dentro del visor.
  async function cargarVista(vista, hash, apilar) {
    var n = ++pedidoVista;
    mostrarCarga(ACTIVA.emp, vista === 'inicio' ? 'Abriendo informes de ' + ACTIVA.emp.nombre : 'Abriendo informe');
    try {
      var d = await pedirConPase({ accion: 'pagina', vista: vista });
      if (n !== pedidoVista) return;
      if (!d.ok) throw new Error(d.error || 'No se pudo abrir el informe.');
      if (apilar) {
        PILA.push({ vista: vista, hash: hash });
        history.pushState({ ciaf: PILA.length }, '');
      }
      document.getElementById('visorTitulo').textContent = vista === 'inicio' ? ACTIVA.emp.nombre : (d.titulo || 'Informe');
      // Marco nuevo en cada pantalla: si se reusara, cada cambio quedaría en el
      // historial del navegador y "atrás" no volvería a la pantalla anterior.
      var marco = nuevoMarco();
      marco.onload = function () { setTimeout(ocultarCarga, 250); };
      marco.srcdoc = prepararHtml(d.html);
      document.getElementById('visor').hidden = false;
    } catch (e) {
      if (n !== pedidoVista) return;
      ocultarCarga();
      if (!PILA.length) {
        cerrarVisor();
        document.getElementById(form.hidden ? 'error2' : 'error').textContent = e.message;
      } else {
        alert(e.message);
      }
    }
  }

  function nuevoMarco() {
    var viejo = document.getElementById('visorFrame');
    var marco = document.createElement('iframe');
    marco.id = 'visorFrame';
    marco.title = 'Informe';
    marco.setAttribute('sandbox', viejo.getAttribute('sandbox'));
    viejo.replaceWith(marco);
    return marco;
  }

  function cerrarVisor() {
    pedidoVista++;
    PILA = [];
    document.getElementById('visor').hidden = true;
    nuevoMarco();
    restaurarBotones();
  }

  // Mensajes que manda el informe desde adentro del visor.
  window.addEventListener('message', async function (ev) {
    var marco = document.getElementById('visorFrame');
    var d = ev.data;
    if (!ACTIVA || ev.source !== marco.contentWindow || !d || typeof d.tipo !== 'string') return;
    if (d.tipo === 'ciaf-run') {
      var resp;
      try {
        var r = await pedirConPase({ accion: 'run', fn: String(d.fn), args: Array.isArray(d.args) ? d.args : [] });
        resp = r.ok ? { ok: true, resultado: r.resultado } : { ok: false, error: r.error || 'Error' };
      } catch (e) {
        resp = { ok: false, error: e.message || 'No se pudo conectar.' };
      }
      resp.tipo = 'ciaf-respuesta';
      resp.id = d.id;
      ev.source.postMessage(resp, '*');
    } else if (d.tipo === 'ciaf-pin') {
      // Una sola vez por pantalla: pase nuevo y se recarga la pantalla actual.
      var actual = PILA[PILA.length - 1];
      if (!actual || actual.reintentoPin) return;
      actual.reintentoPin = true;
      try { await renovarPase(); } catch (e) { return; }
      cargarVista(actual.vista, actual.hash, false);
    } else if (d.tipo === 'ciaf-listo') {
      setTimeout(ocultarCarga, 150);
    } else if (d.tipo === 'ciaf-navegar') {
      var u;
      try { u = new URL(d.url); } catch (e) { return; }
      cargarVista(u.searchParams.get('vista') || 'inicio', u.hash.slice(1), true);
    } else if (d.tipo === 'ciaf-guardar') {
      if (ACTIVA.emp.clavesPin.indexOf(d.clave) >= 0 || /(^|[_-])pin([_-]|$)/i.test(String(d.clave))) return;
      try {
        if (d.valor === null) localStorage.removeItem(prefijoDatos() + d.clave);
        else localStorage.setItem(prefijoDatos() + d.clave, String(d.valor));
      } catch (e) {}
    }
  });

  // Volver: pantalla anterior; desde el menú de la empresa, a la pantalla de
  // ingreso. El botón de la barra lo hace directo; el "atrás" del celular
  // también (cada pantalla deja una marca en el historial para eso).
  function irAtras() {
    if (document.getElementById('visor').hidden) return;
    PILA.pop();
    var anterior = PILA[PILA.length - 1];
    if (anterior) cargarVista(anterior.vista, anterior.hash, false);
    else cerrarVisor();
  }
  window.addEventListener('popstate', irAtras);
  document.getElementById('visorVolver').addEventListener('click', irAtras);

  // Volver en la pantalla de carga: cancela el ingreso o la pantalla que se
  // estaba abriendo (queda la anterior).
  document.getElementById('btnVolverCarga').addEventListener('click', function () {
    cargaCancelada = true; // por si todavía se estaba verificando la clave
    pedidoVista++;         // por si se estaba abriendo una pantalla
    ocultarCarga();
    if (!PILA.length) cerrarVisor();
    restaurarBotones();
  });

  function restaurarBotones() {
    var b1 = document.getElementById('btnEntrar'); b1.disabled = false; b1.textContent = 'Entrar';
    var s = leerSesion();
    var b2 = document.getElementById('btnAbrir'); b2.disabled = false;
    b2.textContent = s && s.huella ? 'Entrar con clave' : 'Ver informes';
    document.getElementById('btnHuella').disabled = false;
  }

  // ---- Huella / cara (WebAuthn) ----
  // La huella nunca sale del celular: el teléfono solo confirma que es la
  // persona. Si el celular lo permite (extensión "prf"), la clave se guarda
  // cifrada y solo se puede leer después de pasar la huella. Si no, la huella
  // funciona como bloqueo de pantalla de la clave guardada.
  var HUELLA_DISPONIBLE = false;
  async function revisarHuella() {
    try {
      HUELLA_DISPONIBLE = !!(window.PublicKeyCredential && window.isSecureContext &&
        PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
        await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
    } catch (e) { HUELLA_DISPONIBLE = false; }
  }
  function aB64(buf) { var b = new Uint8Array(buf), t = ''; for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]); return btoa(t); }
  function deB64(t) { return Uint8Array.from(atob(t), function (c) { return c.charCodeAt(0); }); }
  function azar(n) { return crypto.getRandomValues(new Uint8Array(n)); }

  // Pide la huella para esta credencial; devuelve el secreto PRF (o null).
  async function pedirHuella(h) {
    var op = { publicKey: {
      challenge: azar(32),
      allowCredentials: [{ type: 'public-key', id: deB64(h.credId) }],
      userVerification: 'required',
      timeout: 60000
    } };
    if (h.prf) op.publicKey.extensions = { prf: { eval: { first: deB64(h.salt) } } };
    var cred = await navigator.credentials.get(op);
    var ext = cred && cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    return ext.prf && ext.prf.results && ext.prf.results.first ? ext.prf.results.first : null;
  }
  function llaveDe(secreto) { return crypto.subtle.importKey('raw', secreto, 'AES-GCM', false, ['encrypt', 'decrypt']); }

  async function activarHuella(s) {
    var salt = azar(32);
    var cred = await navigator.credentials.create({ publicKey: {
      challenge: azar(32),
      rp: { name: 'Informes CIAF' },
      user: { id: azar(16), name: s.empresa, displayName: 'Informes CIAF · ' + s.empresa },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000,
      extensions: { prf: { eval: { first: salt } } }
    } });
    var h = { credId: aB64(cred.rawId), salt: aB64(salt), prf: false };
    var ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    if (ext.prf && ext.prf.enabled) {
      // Algunos celulares dan el secreto al crear; otros piden la huella una vez más.
      var secreto = ext.prf.results && ext.prf.results.first;
      if (!secreto) secreto = await pedirHuella({ credId: h.credId, salt: h.salt, prf: true });
      if (secreto) {
        var iv = azar(12);
        var cifrado = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, await llaveDe(secreto), new TextEncoder().encode(s.clave));
        h.prf = true; h.iv = aB64(iv); h.dato = aB64(cifrado);
      }
    }
    var nueva = { empresa: s.empresa, id: s.id, huella: h };
    if (!h.prf) nueva.clave = s.clave;
    guardarSesion(nueva);
    return nueva;
  }

  async function claveConHuella(s) {
    var secreto = await pedirHuella(s.huella);
    if (!s.huella.prf) return s.clave;
    if (!secreto) throw new Error('No se pudo leer la clave guardada.');
    var plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(s.huella.iv) }, await llaveDe(secreto), deB64(s.huella.dato));
    return new TextDecoder().decode(plano);
  }

  // Entra con la clave de la sesión recordada (con o sin huella).
  async function entrarRecordada(s, obtenerClave, boton, silencioso) {
    var err = document.getElementById('error2');
    err.textContent = '';
    boton.disabled = true;
    cargaCancelada = false;
    mostrarCarga({ id: s.id, nombre: s.empresa }, 'Abriendo informes de ' + s.empresa);
    var clave;
    try {
      clave = await obtenerClave();
    } catch (e) {
      ocultarCarga();
      restaurarBotones();
      // Si fue el intento automático al abrir la app, queda el botón para tocar.
      if (!silencioso) err.textContent = 'No se pudo verificar la huella. Probá de nuevo o entrá con la clave.';
      return;
    }
    try {
      abrir(await ingresar(clave));
    } catch (e) {
      ocultarCarga();
      restaurarBotones();
      // Si la clave dejó de valer (cambiaron el PIN), se vuelve a pedir.
      if (/^Clave incorrecta\.$/.test(e.message)) {
        borrarSesion();
        mostrarIngreso();
        document.getElementById('error').textContent = 'La clave guardada ya no es válida. Ingresala de nuevo.';
      } else {
        err.textContent = e.message;
      }
    }
  }

  var form = document.getElementById('formIngreso');
  var seccionRecordada = document.getElementById('recordada');

  function mostrarRecordada(s) {
    form.hidden = true;
    seccionRecordada.hidden = false;
    document.getElementById('subtitulo').textContent = s.empresa;
    var img = document.getElementById('logoRecordada');
    img.src = logoDe(s.id);
    img.alt = s.empresa;
    var conHuella = !!s.huella;
    document.getElementById('btnHuella').hidden = !conHuella;
    var abrirBtn = document.getElementById('btnAbrir');
    abrirBtn.textContent = conHuella ? 'Entrar con clave' : 'Ver informes';
    abrirBtn.className = conHuella ? 'borde' : '';
    document.getElementById('ofertaHuella').hidden = conHuella || !HUELLA_DISPONIBLE || !s.clave;
  }
  function mostrarIngreso() {
    seccionRecordada.hidden = true;
    form.hidden = false;
    document.getElementById('subtitulo').textContent = 'Ingresá la clave de tu empresa';
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('btnEntrar');
    var err = document.getElementById('error');
    var clave = document.getElementById('clave').value.trim();
    if (!clave) return;
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Verificando…';
    cargaCancelada = false;
    mostrarCarga(null, 'Verificando clave');
    try {
      var datos = await ingresar(clave);
      if (document.getElementById('recordar').checked) {
        // Si ya tenía la huella activada para esta empresa, se conserva.
        var previa = leerSesion();
        if (previa && previa.huella && previa.id === datos.empresa.id) {
          if (!previa.huella.prf) previa.clave = clave;
          guardarSesion(previa);
        } else {
          var nueva = { clave: clave, empresa: datos.empresa.nombre, id: datos.empresa.id };
          guardarSesion(nueva);
          // Sin preguntar: si el celular tiene huella, se activa ahora mismo
          // para que la próxima vez se entre con el dedo. Si la cancela, entra igual.
          if (HUELLA_DISPONIBLE) {
            mostrarCarga(datos.empresa, 'Apoyá el dedo para entrar con huella la próxima vez');
            try { await activarHuella(nueva); } catch (e) {}
          }
        }
      }
      abrir(datos);
    } catch (e) {
      ocultarCarga();
      err.textContent = e.message;
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });

  document.getElementById('btnAbrir').addEventListener('click', function () {
    var s = leerSesion();
    if (!s) return mostrarIngreso();
    if (s.huella) {
      // Con la huella activada, este botón es "Entrar con clave": la pide.
      mostrarIngreso();
      document.getElementById('clave').focus();
      return;
    }
    entrarRecordada(s, function () { return Promise.resolve(s.clave); }, this);
  });

  document.getElementById('btnHuella').addEventListener('click', function () {
    var s = leerSesion();
    if (!s || !s.huella) return mostrarIngreso();
    entrarRecordada(s, function () { return claveConHuella(s); }, this);
  });

  document.getElementById('btnActivarHuella').addEventListener('click', async function () {
    var s = leerSesion();
    var err = document.getElementById('error2');
    if (!s || !s.clave) return;
    err.textContent = '';
    this.disabled = true;
    try {
      // Antes de guardar, se confirma que la clave sigue siendo válida.
      await ingresar(s.clave);
      mostrarRecordada(await activarHuella(s));
      document.getElementById('subtitulo').textContent = s.empresa + ' · huella activada';
    } catch (e) {
      err.textContent = e && e.name === 'NotAllowedError'
        ? 'Se canceló la huella. Podés activarla cuando quieras.'
        : 'No se pudo activar la huella en este celular.';
    }
    this.disabled = false;
  });

  document.getElementById('btnSalir').addEventListener('click', function () {
    borrarSesion();
    document.getElementById('clave').value = '';
    mostrarIngreso();
    document.getElementById('clave').focus();
  });

  // Al volver con "atrás" desde los informes: sacar la pantalla de carga y restaurar botones.
  window.addEventListener('pageshow', function () {
    ocultarCarga();
    restaurarBotones();
  });

  var sesion = leerSesion();
  if (sesion && (sesion.clave || sesion.huella)) mostrarRecordada(sesion); else mostrarIngreso();
  // Cuando se sabe si el celular tiene huella, se muestra (o no) la oferta.
  revisarHuella().then(function () {
    var s = leerSesion();
    if (s && (s.clave || s.huella) && !seccionRecordada.hidden) mostrarRecordada(s);
    // Con la huella activada, al abrir la app se pide directo, sin tocar nada.
    if (s && s.huella && HUELLA_DISPONIBLE && !seccionRecordada.hidden) {
      entrarRecordada(s, function () { return claveConHuella(s); }, document.getElementById('btnHuella'), true);
    }
  });

  // ---- Instalar como app ----
  var yaInstalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var esIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var pedidoInstalar = null;
  if (!yaInstalada) {
    // El recuadro se ve siempre que no esté instalada: con botón si el
    // navegador lo permite, si no con los pasos para cada celular.
    document.getElementById('instalar').hidden = false;
    document.getElementById('instalarAyuda').innerHTML = esIos
      ? 'Tocá <strong>Compartir</strong> y después <strong>Agregar a inicio</strong>.'
      : 'Abrí el menú <strong>⋮</strong> del navegador y tocá <strong>Instalar app</strong>.';
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      pedidoInstalar = e;
      document.getElementById('instalarAyuda').textContent = 'Queda en tu pantalla de inicio con el ícono de CIAF.';
      document.getElementById('btnInstalar').hidden = false;
    });
  }
  document.getElementById('btnInstalar').addEventListener('click', async function () {
    if (!pedidoInstalar) return;
    pedidoInstalar.prompt();
    await pedidoInstalar.userChoice.catch(function () {});
    pedidoInstalar = null;
    this.hidden = true;
  });
  window.addEventListener('appinstalled', function () {
    document.getElementById('instalar').hidden = true;
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
</script>
</body>
</html>
